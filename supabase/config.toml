# Local development config for the Supabase CLI (`supabase start`, `supabase functions serve`).
# The hosted project is aligned with `supabase config push` only after review (release runbook).
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "festival-app"

[api]
enabled = true
port = 54321
# `storage` is deliberately not exposed: clients use the Storage API, never PostgREST on storage.*
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
# Placeholder (non-localhost). Sign-in uses typed email codes, so no email contains a link to it;
# the hosted value is set per the release runbook.
site_url = "https://festivalapp.invalid"
additional_redirect_urls = ["festivalapp://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
# Emails sent per hour (project-wide, needs custom SMTP on hosted). Every sign-in code counts, and
# sign_in_sign_ups (template value 30 per 5 minutes per IP) does not stop one client that rotates
# addresses from using it up, which blocks every sign-in for the rest of the hour. CAPTCHA (below)
# is the fix once the app sends a token.
email_sent = 200
# OTP verifications per 5 minutes per IP.
token_verifications = 30

# Not enabled yet: turning CAPTCHA on makes GoTrue reject every signInWithOtp call without a token,
# so it must ship together with an app build that passes options.captchaToken (Cloudflare Turnstile,
# invisible widget) from the enter-email screen. Then uncomment, set the secret as an env var for
# `supabase config push`, and add it to the release runbook's expected diff.
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_signup = true
# GoTrue's email provider also accepts {email, password} on /signup. With confirmations on, such a
# signup gets no session until someone proves the mailbox (the first emailed code does that for
# real users: new addresses receive the confirmation template below). Password tokens are refused
# outright by the access token hook (auth.hook.custom_access_token).
enable_confirmations = true
double_confirm_changes = true
# 8 digits matches the hosted project (commit da99227) and the app's code field.
otp_length = 8
# Codes expire after 10 minutes.
otp_expiry = 600
# Minimum time between code emails to the same address. Must stay explicit: the CLI template
# default is "1s", and `supabase config push` would otherwise overwrite the hosted 60 s.
# Matches the app's 60 s resend cooldown.
max_frequency = "60s"

# Sign-in code for an existing account (signInWithOtp).
[auth.email.template.magic_link]
subject = "Your Festie sign-in code"
content_path = "./supabase/templates/magic_link.html"

# Sign-in code for a brand-new account (first signInWithOtp for an address).
[auth.email.template.confirmation]
subject = "Your Festie sign-in code"
content_path = "./supabase/templates/confirmation.html"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# The function still checks the token itself (auth.getUser); the gateway check is defence in depth.
[functions.delete-account]
enabled = true
verify_jwt = true
import_map = "./functions/delete-account/deno.json"
entrypoint = "./functions/delete-account/index.ts"

# App Review sign-in: called before the reviewer has a session. Returns 404 unless
# DEMO_LOGIN_EMAIL and DEMO_LOGIN_CODE are set as function secrets.
[functions.demo-login]
enabled = true
verify_jwt = false
import_map = "./functions/demo-login/deno.json"
entrypoint = "./functions/demo-login/index.ts"

# Refuses every access token requested with a password (see 007: public.custom_access_token_hook),
# so a password set by someone who registered an address first never yields a session.
# Hosted: Authentication > Hooks > Customize Access Token (JWT) Claims > Postgres function.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# MFA is not offered in v1; keep TOTP explicitly off so `supabase config push` diffs are intended.
[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false
